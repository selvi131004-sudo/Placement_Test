<!DOCTYPE html>
<html>

<head>

<title>Result</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    text-align:center;
}

.box{
    width:500px;
    margin:100px auto;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.2);
}

h1{
    color:#2a5298;
}

.pass{
    color:green;
}

.retry{
    color:red;
}

button{
    padding:15px 30px;
    background:#2a5298;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1e3c72;
}

</style>

</head>

<body>

<div class="box">

<h1>Your Report</h1>

<h2>Name: {{student.name}}</h2>

<h2>Section: {{section}}</h2>

<h2>Score: {{score}}</h2>

<h2>Time Taken: {{time_taken}}</h2>

{% if status == "PASS" %}

<h2 class="pass">PASS</h2>

{% else %}

<h2 class="retry">RETRY</h2>

{% endif %}

<br><br>

<a href="/retry/{{section}}/">

<button>

Retry Test

</button>

</a>

</div>

</body>
</html>
