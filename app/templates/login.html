<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:linear-gradient(to right,#1e3c72,#2a5298);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:350px;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0px 0px 20px rgba(0,0,0,0.3);
}

h1{
    color:#2a5298;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#2a5298;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1e3c72;
}

a{
    text-decoration:none;
    color:#2a5298;
    font-weight:bold;
}

.error{
    color:red;
}

</style>

</head>

<body>

<div class="container">

<h1>Login</h1>

<form method="POST">

{% csrf_token %}

<input type="email"
name="email"
placeholder="Enter Email">

<input type="password"
name="password"
placeholder="Enter Password">

<button type="submit">
Login
</button>

</form>

<br>

<a href="#">
Forgot Password?
</a>

<h3 class="error">{{error}}</h3>

<p>
Don't have an account?
<a href="/register/">Register</a>
</p>

</div>

</body>
</html>
